<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Attendance</title>
</head>
<body>

<input id="nameInput" placeholder="Enter name">
<button onclick="loadGroup()">Check</button>

<form id="attendanceForm" style="display:none;">
  <div id="members"></div>
  <button type="submit">Confirm Attendance</button>
</form>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzxub_JAnDuXnSubvgAsi6qmX7Ztb0M-eVgEAq6nsfyURoBt1eKnqRMp-rhz36a8OUfcA/exec";

function loadGroup() {
  const name = document.getElementById("nameInput").value.trim();
  if (!name) return;

  fetch(`${SCRIPT_URL}?name=${encodeURIComponent(name)}`)
    .then(res => res.json())
    .then(data => {
      if (!data.found) {
        alert("Name not found");
        return;
      }

      const membersDiv = document.getElementById("members");
      membersDiv.innerHTML = "";

      data.members.forEach(m => {
        membersDiv.innerHTML += `
          <label>
            <input type="hidden" name="row[]" value="${m.row}">
            ${m.name}
            <select name="attendance[]">
              <option value="">--</option>
              <option value="Yes">Yes</option>
              <option value="No">No</option>
            </select>
          </label><br>
        `;
      });

      document.getElementById("attendanceForm").style.display = "block";
    });
}

document.getElementById("attendanceForm").addEventListener("submit", function(e) {
  e.preventDefault();

  const formData = new FormData(this);

  fetch(SCRIPT_URL, {
    method: "POST",
    body: formData
  })
  .then(() => alert("Attendance saved!"))
  .catch(() => alert("Failed to save"));
});
</script>

</body>
</html>
