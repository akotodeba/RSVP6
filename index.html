<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Shekinah's @18 RSVP</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">

<style>
body {
  font-family:'Montserrat', sans-serif;
  background:url('https://i.imgur.com/AUfRfam.jpeg') no-repeat center/cover fixed;
  margin:0; min-height:100vh;
  display:flex; align-items:center; justify-content:center;
}
.card {
  background:#fff; padding:30px;
  border-radius:20px; width:90%; max-width:420px;
  text-align:center; box-shadow:0 10px 30px rgba(0,0,0,.3);
}
h1 { font-family:'Great Vibes', cursive; color:#800000; font-size:3rem; }
input, select, button {
  width:100%; padding:12px;
  margin:8px 0; border-radius:10px;
  border:1px solid #800000; font-size:15px;
}
button {
  background:#800000; color:#fff;
  font-weight:600; cursor:pointer;
}
.hidden { display:none; }
.member { margin-bottom:10px; text-align:left; }
</style>
</head>

<body>
<div class="card">
  <h1>Shekinah's @18</h1>
  <p>Enter your full name</p>

  <input id="guestName" placeholder="Full Name">
  <button onclick="searchGuest()">Check</button>

  <p id="message"></p>

  <form id="rsvpForm" class="hidden" method="POST"
        action="https://script.google.com/macros/s/AKfycbyBj5wxa3MtDL58BA5WSC8rMOkrAqawPk7aYggoi9Y0bKTarQk8tZ_nLpcvxd_jQ_xfKg/exec"
        target="hidden_iframe">

    <div id="membersList"></div>
    <input type="hidden" name="payload" id="payload">
    <button type="submit">Confirm Attendance</button>
  </form>

  <p id="thanks" class="hidden">RSVP Saved 💖</p>
</div>

<iframe name="hidden_iframe" style="display:none;"></iframe>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyBj5wxa3MtDL58BA5WSC8rMOkrAqawPk7aYggoi9Y0bKTarQk8tZ_nLpcvxd_jQ_xfKg/exec";

function searchGuest() {
  const name = document.getElementById("guestName").value.trim();
  const msg = document.getElementById("message");
  const list = document.getElementById("membersList");
  const form = document.getElementById("rsvpForm");

  list.innerHTML = "";
  form.classList.add("hidden");
  msg.innerText = "";

  fetch(SCRIPT_URL + "?name=" + encodeURIComponent(name))
    .then(r => r.json())
    .then(d => {
      if (!d.found) {
        msg.innerText = "Name not on the guest list.";
        return;
      }

      form.classList.remove("hidden");
      d.members.forEach(m => {
        const div = document.createElement("div");
        div.className = "member";
        div.innerHTML = `
          <strong>${m.name}</strong>
          <select data-row="${m.row}">
            <option value="">--Select--</option>
            <option value="Yes">Yes</option>
            <option value="No">No</option>
          </select>
        `;
        list.appendChild(div);
      });
    });
}

document.getElementById("rsvpForm").addEventListener("submit", () => {
  const payload = [];
  document.querySelectorAll("#membersList select").forEach(s => {
    payload.push({ row: s.dataset.row, attendance: s.value });
  });
  document.getElementById("payload").value = JSON.stringify(payload);
  document.getElementById("thanks").classList.remove("hidden");
});
</script>
</body>
</html>
