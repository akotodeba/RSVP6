<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Shekinah's @18 RSVP</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">

<style>
body {
  font-family: 'Montserrat', sans-serif;
  background: url('https://i.imgur.com/AUfRfam.jpeg') no-repeat center center fixed;
  background-size: cover;
  margin: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.45);
}
.card {
  position: relative;
  background: rgba(255,255,255,0.95);
  max-width: 450px;
  width: 90%;
  padding: 35px;
  border-radius: 20px;
  box-shadow: 0 15px 40px rgba(0,0,0,0.3);
  text-align: center;
  color: #4b0000;
}
h1 {
  font-family: 'Great Vibes', cursive;
  font-size: 3rem;
  color: #800000;
}
.input-container {
  display: flex;
  gap: 10px;
  margin-bottom: 15px;
}
input, select, button {
  padding: 14px;
  border-radius: 12px;
  border: 1px solid #800000;
  font-size: 16px;
}
button {
  background: #800000;
  color: #fff;
  cursor: pointer;
}
.hidden { display:none; }
#message { margin: 15px 0; font-weight: 600; }
.member {
  margin-bottom: 15px;
}
</style>
</head>

<body>

<div class="card">
  <h1>Shekinah's @18</h1>
  <p>Please enter your full name</p>

  <div class="input-container">
    <input type="text" id="guestName" placeholder="Full Name">
    <button type="button" onclick="searchGuest()">Search</button>
  </div>

  <p id="message"></p>

  <form id="rsvpForm" class="hidden" method="POST" target="hidden_iframe">
    <div id="membersList"></div>
    <button type="submit">Confirm RSVP</button>
  </form>

  <div id="thankYouCard" class="hidden">Thank you! RSVP saved 💖</div>
</div>

<iframe name="hidden_iframe" style="display:none;"></iframe>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxbdsjIcrBZiAkp-5xSEMKRswbbbNyIdxuSVuZs9D4Jqu65a-SyLkhX6TtMg4tha_k6nA/exec";

function searchGuest() {
  const name = document.getElementById("guestName").value.trim();
  const message = document.getElementById("message");
  const form = document.getElementById("rsvpForm");
  const membersList = document.getElementById("membersList");

  message.innerText = "";
  membersList.innerHTML = "";
  form.classList.add("hidden");

  if (!name) {
    message.innerText = "Please enter your name.";
    return;
  }

  fetch(SCRIPT_URL + "?name=" + encodeURIComponent(name))
    .then(res => res.json())
    .then(data => {
      if (!data.found) {
        message.innerText = "Name not on the guest list.";
        return;
      }

      message.innerText = "Confirm RSVP for your group:";
      form.classList.remove("hidden");

      data.members.forEach(m => {
        const div = document.createElement("div");
        div.className = "member";
        div.innerHTML = `
          <strong>${m.name}</strong><br>
          <input type="hidden" name="row[]" value="${m.row}">
          <select name="attendance[]" required>
            <option value="">--Select--</option>
            <option value="Yes" ${m.attendance==="Yes"?"selected":""}>Yes</option>
            <option value="No" ${m.attendance==="No"?"selected":""}>No</option>
          </select>
        `;
        membersList.appendChild(div);
      });
    });
}

document.getElementById("rsvpForm").addEventListener("submit", () => {
  document.getElementById("rsvpForm").classList.add("hidden");
  document.getElementById("message").innerText = "";
  document.getElementById("thankYouCard").classList.remove("hidden");
});
</script>

</body>
</html>
