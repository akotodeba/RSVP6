<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Shekinah's @18 RSVP</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">

<style>
/* Body & Background */
body {
  font-family: 'Montserrat', sans-serif;
  background: url('https://i.imgur.com/AUfRfam.jpeg') no-repeat center center fixed;
  background-size: cover;
  margin: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  position: relative;
}

body::before {
  content: "";
  position: absolute;
  top:0; left:0;
  width:100%; height:100%;
  background: rgba(0,0,0,0.5);
  z-index: 0;
}

/* Bubble Container */
.card {
  position: relative;
  z-index: 1;
  background: rgba(255, 255, 255, 0.2); /* low opacity bubble */
  backdrop-filter: blur(10px); /* frosted glass effect */
  border-radius: 40px;
  padding: 40px 30px;
  max-width: 420px;
  width: 90%;
  box-shadow: 0 15px 40px rgba(0,0,0,0.3);
  text-align: center;
  color: #4b0000;
  display: flex;
  flex-direction: column;
  gap: 15px;
  border: 1px solid rgba(255,255,255,0.3);
  transition: all 0.3s ease;
}

/* Header */
h1 {
  font-family: 'Great Vibes', cursive;
  font-size: 3rem;
  color: #800000;
  margin: 0 0 10px 0;
}

/* Paragraph */
p {
  margin: 0;
  font-size: 1rem;
  color: #4b0000;
}

/* Input & Button Styles */
input, select, button {
  padding: 12px 15px;
  font-size: 16px;
  border-radius: 25px;
  border: 1px solid #800000;
  background: rgba(255,255,255,0.8);
}

input:focus, select:focus {
  outline: none;
  border: 2px solid #a00000;
  box-shadow: 0 0 10px rgba(160,0,0,0.3);
}

button {
  background: #800000;
  color: white;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s ease;
  border-radius: 25px;
}

button:hover {
  background: #a00000;
  box-shadow: 0 5px 15px rgba(160,0,0,0.4);
}

/* Input container */
.input-container {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.input-container button {
  width: 100%;
}

/* Members List */
#membersList {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-top: 10px;
}

.member {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 20px;
  border-radius: 25px;
  background: rgba(255, 255, 255, 0.4);
  backdrop-filter: blur(5px);
  box-shadow: 0 3px 10px rgba(0,0,0,0.1);
}

.member span {
  flex: 1;
  text-align: left;
  font-weight: 500;
  font-size: 1rem;
}

.member select {
  min-width: 100px;
  padding: 6px 10px;
  font-size: 1rem;
  border-radius: 20px;
  border: 1px solid #800000;
  background: rgba(255,255,255,0.85);
}

/* Message & Thank you */
#message {
  font-weight: 600;
  font-size: 1rem;
  color: #800000;
  min-height: 20px;
}

#thanks {
  font-weight: 600;
  font-size: 1.1rem;
  color: #800000;
  margin-top: 10px;
}

/* Hidden class */
.hidden { display: none; }

/* Responsive */
@media screen and (max-width: 480px) {
  .card { padding: 25px; border-radius: 30px; }
  h1 { font-size: 2.2rem; }
  input, select, button { font-size: 15px; padding: 10px 12px; }
  .member select { min-width: 90px; }
}
</style>
</head>

<body>
<div class="card">
  <h1>Shekinah's @18</h1>
  <p>Please enter your full name</p>

  <div class="input-container">
    <input id="guestName" placeholder="Full Name">
    <button type="button" onclick="searchGuest()">Check</button>
  </div>

  <p id="message"></p>

  <!-- RSVP Form -->
  <form id="rsvpForm" class="hidden" method="POST"
        action="https://script.google.com/macros/s/AKfycbyBj5wxa3MtDL58BA5WSC8rMOkrAqawPk7aYggoi9Y0bKTarQk8tZ_nLpcvxd_jQ_xfKg/exec"
        target="hidden_iframe">

    <div id="membersList"></div>
    <input type="hidden" name="payload" id="payload">
    <button type="submit">Confirm Attendance</button>
  </form>

  <p id="thanks" class="hidden">RSVP Saved 💖</p>
</div>

<iframe name="hidden_iframe" style="display:none;"></iframe>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyBj5wxa3MtDL58BA5WSC8rMOkrAqawPk7aYggoi9Y0bKTarQk8tZ_nLpcvxd_jQ_xfKg/exec";

function searchGuest() {
  const name = document.getElementById("guestName").value.trim();
  const msg = document.getElementById("message");
  const list = document.getElementById("membersList");
  const form = document.getElementById("rsvpForm");

  msg.innerText = "";
  list.innerHTML = "";
  form.classList.add("hidden");
  document.getElementById("thanks").classList.add("hidden");

  if (!name) { msg.innerText = "Please enter your name."; return; }

  fetch(SCRIPT_URL + "?name=" + encodeURIComponent(name))
    .then(r => r.json())
    .then(d => {
      if (!d.found) {
        msg.innerText = "Name not on the guest list.";
        return;
      }

      form.classList.remove("hidden");
      d.members.forEach(m => {
        const div = document.createElement("div");
        div.className = "member";
        div.innerHTML = `
          <span>${m.name}</span>
          <select data-row="${m.row}">
            <option value="">--Select--</option>
            <option value="Yes" ${m.attendance==="Yes"?"selected":""}>Yes</option>
            <option value="No" ${m.attendance==="No"?"selected":""}>No</option>
          </select>
        `;
        list.appendChild(div);
      });
    })
    .catch(()=> { msg.innerText = "Error connecting to server."; });
}

document.getElementById("rsvpForm").addEventListener("submit", () => {
  const payload = [];
  document.querySelectorAll("#membersList select").forEach(s => {
    payload.push({ row: s.dataset.row, attendance: s.value });
  });
  document.getElementById("payload").value = JSON.stringify(payload);
  document.getElementById("rsvpForm").classList.add("hidden");
  document.getElementById("message").innerText = "";
  document.getElementById("thanks").classList.remove("hidden");
});
</script>
</body>
</html>
