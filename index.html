<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Shekinah's @18 RSVP</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">

<style>
/* Body & Background */
body {
  font-family: 'Montserrat', sans-serif;
  background: url('https://i.imgur.com/AUfRfam.jpeg') no-repeat center center fixed;
  background-size: cover;
  margin: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  position: relative;
  overflow: hidden;
}

body::before {
  content: "";
  position: absolute;
  top:0; left:0;
  width:100%; height:100%;
  background: rgba(0,0,0,0.5);
  z-index: 0;
}

/* Glitter animation */
@keyframes glitterMove {
  0% {background-position: 0 0;}
  100% {background-position: 200% 200%;}
}

.glitter {
  position: absolute;
  top:0; left:0;
  width:100%;
  height:100%;
  background: radial-gradient(circle, rgba(255,215,0,0.3) 0%, transparent 70%); /* golden glitter */
  background-size: 200% 200%;
  animation: glitterMove 7s linear infinite; /* a bit faster glitter */
  pointer-events: none;
  z-index: 0;
}

/* Bubble Container */
.card {
  position: relative;
  z-index: 1;
  background: rgba(255,255,255,0.25); /* low opacity bubble */
  backdrop-filter: blur(6px);
  border-radius: 30px;
  padding: 30px 25px;
  max-width: 380px;
  width: 85%;
  box-shadow: 0 10px 25px rgba(0,0,0,0.25);
  text-align: center;
  color: #4b0000;
  display: flex;
  flex-direction: column;
  gap: 12px;
  border: 1px solid rgba(255,255,255,0.3);
  transition: all 0.2s ease;
}

/* Header */
h1 {
  font-family: 'Great Vibes', cursive;
  font-size: 2.8rem;
  color: #ffdfdf;
  text-shadow: 1px 1px 4px #5a0000; /* darker red shadow */
  margin: 0 0 10px 0;
}

/* Paragraph */
p {
  margin: 0;
  font-size: 1rem;
  color: #fff;
  text-shadow: 1px 1px 3px #5a0000;
}

/* Input & Button Styles */
input, select, button {
  padding: 10px 12px;
  font-size: 15px;
  border-radius: 20px;
  border: 1px solid #5a0000; /* darker red border */
  background: rgba(255,255,255,0.85);
}

input:focus, select:focus {
  outline: none;
  border: 2px solid #660000; /* darker red focus */
  box-shadow: 0 0 8px rgba(102,0,0,0.3);
}

button {
  background: #5a0000; /* darker red */
  color: white;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.25s ease;
  border-radius: 20px;
}

button:hover {
  background: #7a0000;
  box-shadow: 0 5px 12px rgba(122,0,0,0.4);
}

/* Input container */
.input-container {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.input-container button { width: 100%; }

/* Members List */
#membersList {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-top: 8px;
}

.member {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 15px;
  border-radius: 20px;
  background: rgba(255,255,255,0.35);
  backdrop-filter: blur(4px);
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

.member span {
  flex: 1;
  text-align: left;
  font-weight: 500;
  font-size: 1rem;
  color: #4b0000;
}

.member select {
  min-width: 90px;
  padding: 5px 8px;
  font-size: 1rem;
  border-radius: 15px;
  border: 1px solid #5a0000; /* darker red */
  background: rgba(255,255,255,0.9);
}

/* Message & Thank you */
#message {
  font-weight: 600;
  font-size: 1rem;
  color: #fff;
  text-shadow: 1px 1px 3px #5a0000;
  min-height: 20px;
}

#thanks {
  font-weight: 600;
  font-size: 1.1rem;
  color: #ffdfdf;
  text-shadow: 1px 1px 4px #5a0000;
  margin-top: 5px;
}

/* Hidden class */
.hidden { display: none; }

/* Responsive */
@media screen and (max-width: 480px) {
  .card { padding: 20px; border-radius: 25px; }
  h1 { font-size: 2.2rem; }
  input, select, button { font-size: 14px; padding: 8px 10px; }
  .member select { min-width: 80px; }
}
</style>
</head>

<body>
<div class="glitter"></div>

<div class="card">
  <h1>Shekinah's @18</h1>
  <p>Kindly confirm your attendance</p>

  <div class="input-container">
    <input id="guestName" placeholder="Enter Your Full Name">
    <button type="button" onclick="searchGuest()">Check</button>
  </div>

  <p id="message"></p>

  <!-- RSVP Form -->
  <form id="rsvpForm" class="hidden" method="POST"
        action="https://script.google.com/macros/s/AKfycbwaTa702niJIZ29D3OGcrztgzb5gzgi76VnXPySm2OQPDMJak2j3lQgmOuqaeUXNNUyuw/exec"
        target="hidden_iframe">

    <div id="membersList"></div>
    <input type="hidden" name="payload" id="payload">
    <button type="submit">Confirm Attendance</button>
  </form>

  <p id="thanks" class="hidden">Thank you! Your RSVP is confirmed</p>
</div>

<iframe name="hidden_iframe" style="display:none;"></iframe>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwaTa702niJIZ29D3OGcrztgzb5gzgi76VnXPySm2OQPDMJak2j3lQgmOuqaeUXNNUyuw/exec";

function searchGuest() {
  const name = document.getElementById("guestName").value.trim();
  const msg = document.getElementById("message");
  const list = document.getElementById("membersList");
  const form = document.getElementById("rsvpForm");

  msg.innerText = "";
  list.innerHTML = "";
  form.classList.add("hidden");
  document.getElementById("thanks").classList.add("hidden");

  if (!name) { msg.innerText = "Please enter your name."; return; }

  fetch(SCRIPT_URL + "?name=" + encodeURIComponent(name))
    .then(r => r.json())
    .then(d => {
      if (!d.found) {
        msg.innerText = "Name not on the guest list.";
        return;
      }

      form.classList.remove("hidden");
      d.members.forEach(m => {
        const div = document.createElement("div");
        div.className = "member";
        div.innerHTML = `
          <span>${m.name}</span>
          <select data-row="${m.row}">
            <option value="">--Select--</option>
            <option value="Yes" ${m.attendance==="Yes"?"selected":""}>Yes</option>
            <option value="No" ${m.attendance==="No"?"selected":""}>No</option>
          </select>
        `;
        list.appendChild(div);
      });
    })
    .catch(()=> { msg.innerText = "Error connecting to server."; });
}

document.getElementById("rsvpForm").addEventListener("submit", () => {
  const payload = [];
  document.querySelectorAll("#membersList select").forEach(s => {
    payload.push({ row: s.dataset.row, attendance: s.value });
  });
  document.getElementById("payload").value = JSON.stringify(payload);
  document.getElementById("rsvpForm").classList.add("hidden");
  document.getElementById("message").innerText = "";
  document.getElementById("thanks").classList.remove("hidden");
});
</script>
</body>
</html>
